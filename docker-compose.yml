version: "3.9"

services:
  # Primary Enterprise Web Dashboard (Streamlit - Port 8501)
  trust-intelligence-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trust_intelligence_app
    ports:
      - "8501:8501"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    volumes:
      - ./trust_agent.db:/app/trust_agent.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Dedicated Model Context Protocol (MCP) Service
  trust-mcp-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trust_mcp_service
    command: ["python", "mcp_server.py", "--test"]
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    volumes:
      - ./trust_agent.db:/app/trust_agent.db
    restart: "no"
